# Keeps the free Supabase project from pausing (it pauses after 7 days
# with no activity). Runs a tiny database query every 3 days.
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables
# → Actions): SUPABASE_URL and SUPABASE_ANON_KEY — the same values as env.json.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 */3 * *" # 06:00 UTC every 3 days
  workflow_dispatch: # "Run workflow" button for a manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL / SUPABASE_ANON_KEY repository secrets." >&2
            exit 1
          fi
          # RLS returns no rows to the anon key, but Postgres still runs the query.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/reward_rules?select=reason&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]
